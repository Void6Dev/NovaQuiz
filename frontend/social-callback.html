<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signing in…</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f11;
      color: #a0a0b0;
      display: grid;
      place-items: center;
      height: 100vh;
    }
    .wrap { text-align: center; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2a35;
      border-top-color: #7c6af7;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 20px;
    }
    p { font-size: 14px; letter-spacing: 0.01em; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner"></div>
    <p>Completing login…</p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const code  = params.get('code');
      const error = params.get('error');

      const msg = code
        ? { type: 'social-callback', code }
        : { type: 'social-callback', error: error || 'Authorization denied' };

      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(msg, location.origin);
        window.close();
      } else {
        document.querySelector('p').textContent = 'This window can be closed.';
        document.querySelector('.spinner').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
