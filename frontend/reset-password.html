<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password вЂ” Nova Quiz</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="api.js"></script>
  <script src="i18n.js"></script>
  <script src="nav.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components/shared.jsx"></script>
  <script type="text/babel" src="components/toast.jsx"></script>
  <script type="text/babel" src="components/footer.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="screens/auth.jsx"></script>

  <script type="text/babel">
    const { token } = window.getQueryParams();

    function ResetPage() {
      const inner = !token
        ? (
          <div style={{ textAlign: 'center', color: 'var(--text-muted)', fontSize: 14 }}>
            {t('auth.reset_bad_token')}
          </div>
        )
        : <ResetPasswordForm token={token} />;

      return (
        <div style={{
          minHeight: '100vh', display: 'grid', placeItems: 'center',
          padding: '32px 16px', background: 'var(--bg)',
        }}>
          <div style={{ width: '100%', maxWidth: 380 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 40 }}>
              <NQLogo size={28} />
              <span style={{ fontWeight: 700, fontSize: 16, letterSpacing: '-0.02em' }}>
                Nova<span style={{ color: 'var(--accent)' }}>Quiz</span>
              </span>
            </div>
            {inner}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ResetPage />);
  </script>
</body>
</html>
