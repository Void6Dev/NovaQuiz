<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Quiz</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="theme-init.js"></script>
</head>
<body>
  <div id="root"></div>

  <script src="lib/react.development.js"></script>
  <script src="lib/react-dom.development.js"></script>
  <script src="lib/babel.min.js"></script>

  <script src="api.js"></script>
  <script src="i18n.js"></script>
  <script src="nav.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="components/shared.jsx"></script>
  <script type="text/babel" src="components/toast.jsx"></script>
  <script type="text/babel" src="components/footer.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="screens/auth.jsx"></script>

  <script type="text/babel">
    const { mode } = window.getQueryParams();
    const initialMode = mode === 'register' ? 'register' : 'login';

    ReactDOM.createRoot(document.getElementById('root')).render(
      <FullPage current={initialMode}>
        <Auth mode={initialMode} onSuccess={() => window.navigate('dashboard')} />
      </FullPage>
    );
  </script>
</body>
</html>
